services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postmanfox-app
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    expose: ["3000"]
    networks: [web]

  caddy:
    image: caddy:2
    container_name: postmanfox-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [web]

networks:
  web: {}

volumes:
  caddy_data: {}
  caddy_config: {}
